<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b539e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GTCT" />
    <title>GTCT Preparation</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/prep.css?v=prep-edit-m1" />
  </head>
  <body>
    <section id="login-view" class="view login-view" hidden>
      <div class="login-card">
        <p class="brand">GTCT Restaurant</p>
        <h1>Preparation</h1>
        <p class="hint">Sign in to work a preparation station.</p>
        <div class="login-form">
          <div class="field">
            <label for="login-username">Username</label>
            <input id="login-username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" />
          </div>
          <button type="button" id="login-btn" class="btn primary">Sign in</button>
          <p id="login-error" class="error" hidden></p>
        </div>
      </div>
    </section>

    <section id="main-view" class="view" hidden>
      <header class="topbar">
        <div class="topbar-brand">
          <p class="brand-inline">GTCT</p>
          <h1 id="station-title">Preparation</h1>
        </div>
        <div class="topbar-actions">
          <span class="banner compact test-badge">TEST</span>
          <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-expanded="false" aria-controls="app-nav" aria-label="Open navigation menu">
            <span class="nav-menu-icon" aria-hidden="true"></span>
          </button>
          <nav id="app-nav" class="app-nav" aria-label="Main">
            <div class="nav-primary" role="group" aria-label="Floor">
              <a class="nav-link" href="/">Sales</a>
              <a class="nav-link" href="/orders.html">Orders</a>
              <a class="nav-link" href="/prep.html" aria-current="page">Prep</a>
            </div>
            <details id="account-menu" class="nav-pop">
              <summary class="nav-account-btn" aria-label="Account">
                <span id="session-role" class="nav-account-name"></span>
              </summary>
              <div class="nav-dropdown nav-dropdown-account" role="menu">
                <button type="button" id="logout-btn" class="nav-dropdown-link nav-logout">Sign Out</button>
              </div>
            </details>
          </nav>
        </div>
      </header>
      <main class="prep-page">
        <p id="prep-denied" class="error" hidden>You do not have permission to work a preparation station.</p>
        <div id="prep-shell">
          <div id="station-tabs" class="chips chip-scroll" role="tablist" aria-label="Preparation stations"></div>
          <div id="prep-alerts" class="prep-alerts" aria-live="assertive"></div>
          <div id="prep-wake-banner" class="prep-wake-banner" hidden role="status" aria-live="assertive">
            <strong id="prep-wake-text">New orders</strong>
            <span>Tap to dismiss</span>
          </div>
          <p id="prep-status" class="hint" aria-live="polite">Loading orders…</p>
          <div id="prep-board" class="prep-board">
            <div class="prep-active-layout">
              <section class="prep-column prep-column-preparing" aria-labelledby="preparing-heading">
                <h2 id="preparing-heading">Preparing <span id="prep-preparing-count" class="prep-count">0</span></h2>
                <div id="prep-preparing-list" class="prep-ticket-list"></div>
              </section>
              <section class="prep-column prep-column-new" aria-labelledby="new-heading">
                <h2 id="new-heading">New <span id="prep-new-count" class="prep-count">0</span></h2>
                <div id="prep-new-list" class="prep-ticket-list"></div>
              </section>
            </div>
            <section class="prep-history" aria-label="Finished orders">
              <button type="button" id="prep-finished-toggle" class="prep-history-toggle" aria-expanded="false" aria-controls="prep-finished-panel">
                <span>Finished <span id="prep-finished-count" class="prep-count">0</span></span>
                <span id="prep-finished-toggle-label" class="prep-history-toggle-label">Show orders ▾</span>
              </button>
              <div id="prep-finished-panel" class="prep-finished-panel" hidden>
                <input type="search" id="prep-finished-search" aria-label="Search finished orders" placeholder="Search finished orders" autocomplete="off" />
                <div id="prep-finished-list" class="prep-finished-grid"></div>
                <p id="prep-finished-empty" class="prep-history-empty" hidden>No matching finished orders</p>
              </div>
            </section>
          </div>
        </div>
      </main>
      <div id="prep-focus-backdrop" class="prep-focus-backdrop" hidden>
        <section class="prep-focus-dialog" role="dialog" aria-modal="true" aria-labelledby="prep-focus-number" tabindex="-1">
          <header class="prep-focus-head">
            <div>
              <p class="prep-focus-kicker">PREPARING</p>
              <p id="prep-focus-token" class="prep-focus-token" hidden></p>
              <h2 id="prep-focus-number">Order</h2>
              <div id="prep-focus-meta" class="prep-focus-meta"></div>
            </div>
            <div class="prep-focus-head-actions">
              <div class="scroll-nav scroll-nav--topbar prep-focus-scroll" role="group" aria-label="Scroll order items">
                <button type="button" id="prep-focus-scroll-up" class="scroll-nav-btn" aria-label="Go up" title="Go up">
                  <svg class="scroll-nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6.7 14.7a1 1 0 0 1 0-1.4l4.6-4.6a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 1 1-1.4 1.4L12 11.4l-3.9 3.3a1 1 0 0 1-1.4 0z"/></svg>
                  <span class="scroll-nav-label">Up</span>
                </button>
                <button type="button" id="prep-focus-scroll-down" class="scroll-nav-btn" aria-label="Go down" title="Go down">
                  <svg class="scroll-nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6.7 9.3a1 1 0 0 1 1.4 0L12 12.6l3.9-3.3a1 1 0 1 1 1.4 1.4l-4.6 4.6a1 1 0 0 1-1.4 0l-4.6-4.6a1 1 0 0 1 0-1.4z"/></svg>
                  <span class="scroll-nav-label">Down</span>
                </button>
              </div>
              <button type="button" id="prep-focus-close" class="prep-focus-close" aria-label="Close focused order">Close ✕</button>
            </div>
          </header>
          <div id="prep-focus-body" class="prep-focus-body"></div>
          <footer class="prep-focus-footer">
            <p id="prep-focus-feedback" class="prep-focus-feedback" role="status"></p>
            <button type="button" id="prep-focus-finish" class="btn primary">Finished</button>
          </footer>
        </section>
      </div>
    </section>
    <script type="module" src="/prep.js?v=prep-edit-m1"></script>
      <script defer src="/scroll-nav.js"></script>
  </body>
</html>
