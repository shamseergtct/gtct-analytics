<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b539e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GTCT" />
    <title>GTCT Orders</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/orders.css" />
    <link rel="stylesheet" href="/monitor.css?v=board-compact1" />
  </head>
  <body>
    <section id="login-view" class="view login-view" hidden>
      <div class="login-card">
        <p class="brand">GTCT Restaurant</p>
        <h1>Orders</h1>
        <p class="hint">Sign in to view accepted orders.</p>
        <div class="login-form">
          <div class="field">
            <label for="login-username">Username</label>
            <input id="login-username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" />
          </div>
          <button type="button" id="login-btn" class="btn primary">Sign in</button>
          <p id="login-error" class="error" hidden></p>
        </div>
      </div>
    </section>

    <section id="main-view" class="view" hidden>
      <header class="topbar">
        <div class="topbar-brand">
          <p class="brand-inline">GTCT</p>
          <h1>Orders</h1>
        </div>
        <div class="topbar-actions">
          <span class="banner compact test-badge">TEST</span>
          <button type="button" id="nav-menu-btn" class="nav-menu-btn" aria-expanded="false" aria-controls="app-nav" aria-label="Open navigation menu">
            <span class="nav-menu-icon" aria-hidden="true"></span>
          </button>
          <nav id="app-nav" class="app-nav" aria-label="Main">
            <div class="nav-primary" role="group" aria-label="Floor">
              <a class="nav-link" href="/">Sales</a>
              <a class="nav-link" href="/orders.html" aria-current="page">Orders</a>
              <a class="nav-link" href="/monitor.html">Monitor</a>
              <a id="prep-link" class="nav-link" href="/prep.html" hidden>Prep</a>
            </div>
            <details id="account-menu" class="nav-pop">
              <summary class="nav-account-btn" aria-label="Account">
                <span id="session-role" class="nav-account-name"></span>
              </summary>
              <div class="nav-dropdown nav-dropdown-account" role="menu">
                <button type="button" id="logout-btn" class="nav-dropdown-link nav-logout">Sign Out</button>
              </div>
            </details>
          </nav>
        </div>
      </header>

      <main class="orders-page">
        <p id="orders-denied" class="error" hidden>You do not have permission to view orders.</p>
        <div id="orders-shell">
          <section class="shift-bar" aria-label="Business shift" id="shift-bar">
            <p id="shift-info" class="hint" aria-live="polite">Loading business shift…</p>
            <div class="shift-actions" id="shift-actions" hidden>
              <input id="shift-next-date" type="date" aria-label="Business date for next shift" hidden />
              <button type="button" id="shift-open" class="btn ghost" hidden>Open Shift</button>
              <button type="button" id="shift-close" class="btn ghost" hidden>Close Shift</button>
            </div>
          </section>
          <div class="orders-view-toggle" role="group" aria-label="Orders view">
            <button type="button" id="view-list-btn" class="orders-view-btn" aria-pressed="true">List</button>
            <button type="button" id="view-board-btn" class="orders-view-btn" aria-pressed="false">Board</button>
          </div>
          <div id="type-tabs" class="chips orders-type-tabs" role="tablist" aria-label="Order types"></div>
          <div class="orders-tools">
            <input id="order-search" type="search" placeholder="Search invoice, token, customer" aria-label="Search invoice, token or customer" />
            <input id="order-date" type="date" aria-label="Order date" />
            <button type="button" id="clear-filters" class="btn ghost">Clear</button>
          </div>
          <div id="delivery-tools" class="orders-tools" hidden>
            <input id="filter-block" type="text" placeholder="Block" aria-label="Block" />
            <input id="filter-road" type="text" placeholder="Road" aria-label="Road" />
            <input id="filter-building" type="text" placeholder="Building" aria-label="Building" />
            <div id="address-type-tabs" class="chips" role="tablist" aria-label="Address type"></div>
          </div>
          <p id="orders-status" class="hint" aria-live="polite">Loading orders…</p>
          <div id="orders-list-panel">
            <div id="orders-list"></div>
            <div class="orders-pager">
              <button type="button" id="page-prev" class="btn ghost">Previous</button>
              <span id="page-label"></span>
              <button type="button" id="page-next" class="btn ghost">Next</button>
            </div>
          </div>
          <div id="orders-board-panel" class="orders-board-panel" hidden>
            <div id="orders-board" class="monitor-list" aria-live="polite"></div>
            <div class="orders-pager">
              <button type="button" id="board-page-prev" class="btn ghost">Previous</button>
              <span id="board-page-label"></span>
              <button type="button" id="board-page-next" class="btn ghost">Next</button>
            </div>
          </div>
        </div>
      </main>
    </section>

    <dialog id="order-detail" class="order-detail">
      <form method="dialog">
        <header class="order-detail-head">
          <h2 id="detail-title">Order</h2>
          <button type="submit" class="btn ghost">Close</button>
        </header>
        <div id="detail-body"></div>
      </form>
    </dialog>
    <script type="module" src="/orders.js"></script>
  </body>
</html>
