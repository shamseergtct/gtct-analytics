<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0;url=/orders.html?view=board" />
  <title>Opening Orders Board…</title>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      params.set("view", "board");
      location.replace("/orders.html?" + params.toString());
    })();
  </script>
</head>
<body>
  <p><a id="board-redirect" href="/orders.html?view=board">Opening Orders Board...</a></p>
  <noscript>
    <p><a href="/orders.html?view=board">Opening Orders Board...</a></p>
  </noscript>
  <script>
    (function () {
      var a = document.getElementById("board-redirect");
      if (!a) return;
      var params = new URLSearchParams(location.search);
      params.set("view", "board");
      a.href = "/orders.html?" + params.toString();
    })();
  </script>
</body>
</html>
